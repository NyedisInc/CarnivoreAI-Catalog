<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clean your tv</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><span class="label">clean your tv</span><span id="msg" class="msg" role="status"></span></header>
<main>
  <section class="block">
    <div class="label sub">add a tv</div>
    <div id="add" class="row">
      <input id="ip" placeholder="tv ip, e.g. 192.168.1.50" autocomplete="off" spellcheck="false" aria-label="tv ip address">
      <input id="nm" placeholder="name (optional)" autocomplete="off" aria-label="tv name">
      <button type="button" id="addgo" class="btn">add</button>
    </div>
    <p class="note">on the tv: developer options, usb debugging and network debugging on. nothing is scanned; only the address you type is contacted.</p>
  </section>
  <div id="tvs"></div>
</main>
<script src="app.js"></script>
</body>
</html>
